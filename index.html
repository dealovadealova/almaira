



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRA STORE - Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #166534; --primary-light: #dcfce7; --primary-dark: #14532d;
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569; --border: #e2e8f0;
            --shopee: #ee4d2d; --tiktok: #000000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
        a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 50%, var(--primary) 100%);
            color: white; padding: 50px 20px 90px; text-align: center; position: relative; overflow: hidden;
        }
        .header::before { content: ''; position: absolute; top: -30%; right: -10%; width: 500px; height: 500px; background: rgba(255,255,255,0.06); border-radius: 50%; animation: float 8s ease-in-out infinite; }
        .header::after { content: ''; position: absolute; bottom: -20%; left: -10%; width: 400px; height: 400px; background: rgba(255,255,255,0.04); border-radius: 50%; animation: float 10s ease-in-out infinite reverse; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-30px) rotate(5deg); } }
        .header-content { position: relative; z-index: 2; max-width: 800px; margin: 0 auto; }
        .header-logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid rgba(255,255,255,0.3); margin-bottom: 20px; background: white; box-shadow: 0 15px 35px rgba(0,0,0,0.2); animation: logoFloat 3s ease-in-out infinite; }
        @keyframes logoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .header h1 { font-size: 36px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.15); }
        .header .tagline { font-size: 16px; opacity: 0.95; font-weight: 500; margin-bottom: 25px; }
        .digital-clock { display: inline-block; background: rgba(255,255,255,0.18); padding: 15px 30px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.25); font-size: 14px; font-weight: 600; letter-spacing: 0.5px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .clock-time { font-size: 20px; font-weight: 800; margin-right: 10px; }

        .wa-float { position: fixed; bottom: 25px; right: 25px; background: #25D366; color: white; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 12px 30px rgba(37, 211, 102, 0.5); z-index: 100; transition: transform 0.3s; animation: waWiggle 2s ease-in-out infinite; }
        .wa-float:hover { transform: scale(1.12); }
        @keyframes waWiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

        .controls { max-width: 1200px; margin: -50px auto 40px; padding: 0 20px; position: relative; z-index: 3; }
        .controls-inner { background: rgba(255,255,255,0.97); padding: 25px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); display: flex; gap: 20px; flex-wrap: wrap; align-items: center; border: 1px solid rgba(255,255,255,0.6); }
        .search-box { flex: 1; min-width: 280px; position: relative; }
        .search-box input { width: 100%; padding: 16px 20px 16px 55px; border: 2px solid var(--border); border-radius: 50px; font-size: 15px; background: #fff; font-weight: 500; }
        .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15,118,110,0.12); }
        .search-box::before { content: '🔍'; position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 20px; }
        .categories { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; width: 100%; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { padding: 12px 24px; background: var(--bg); border: 2px solid var(--border); border-radius: 50px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.3s; color: var(--muted); }
        .cat-btn:hover { border-color: var(--primary); color: var(--primary); }
        .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 80px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card { background: var(--card); border-radius: 24px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s; }
        .card:hover { transform: translateY(-6px); box-shadow: 0 25px 50px rgba(0,0,0,0.1); }
        .card-img-wrap { position: relative; overflow: hidden; height: 240px; background: #f1f5f9; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 28px; flex: 1; display: flex; flex-direction: column; }
        .card-cat { display: inline-block; background: var(--primary-light); color: var(--primary-dark); padding: 7px 16px; border-radius: 50px; font-size: 11px; font-weight: 800; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; width: fit-content; }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; line-height: 1.4; }
        .card-desc { font-size: 14px; color: var(--muted); margin-bottom: 22px; line-height: 1.7; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .card-price { font-size: 26px; font-weight: 800; color: var(--primary-dark); margin-bottom: 22px; letter-spacing: -0.5px; }
        .card-actions { display: flex; gap: 12px; }
        .btn-buy { flex: 1; padding: 14px; border-radius: 14px; text-decoration: none; text-align: center; font-size: 14px; font-weight: 700; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-shopee { background: var(--shopee); color: white; }
        .btn-shopee:hover { background: #d73211; }
        .btn-tiktok { background: var(--tiktok); color: white; }
        .btn-tiktok:hover { background: #333; }

        .state { text-align: center; padding: 100px 20px; color: var(--muted); grid-column: 1/-1; }
        .spinner { width: 60px; height: 60px; border: 5px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 25px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .retry { margin-top: 16px; padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }

        .footer { text-align: center; padding: 40px 20px; background: white; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; font-weight: 500; }

        @media (max-width: 768px) {
            .header { padding: 40px 20px 70px; }
            .header h1 { font-size: 28px; }
            .header .tagline { font-size: 14px; }
            .digital-clock { padding: 12px 20px; font-size: 12px; }
            .clock-time { font-size: 16px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
            .card-img-wrap { height: 180px; }
            .card-body { padding: 18px; }
            .card-title { font-size: 15px; }
            .card-price { font-size: 20px; }
            .btn-buy { font-size: 12px; padding: 11px; }
            .wa-float { width: 58px; height: 58px; bottom: 20px; right: 20px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>

    <footer class="footer">© <span id="year"></span> <strong>AIRA STORE</strong>. Semua hak dilindungi.</footer>

    <script>
        const API_URL = "https://docs.google.com/spreadsheets/d/11elD5Q28RPwKsSNMwfG_zFEimnVHIp4T84jmHh4S_JA/edit?usp=drive_link";
        const PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="240"><rect width="100%" height="100%" fill="#f1f5f9"/><text x="50%" y="50%" fill="#475569" font-family="sans-serif" font-size="18" text-anchor="middle">Tanpa foto</text></svg>');

        // ===== Utilitas =====
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function safeUrl(u) {
            try {
                const x = new URL(String(u || '').trim());
                return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : '';
            } catch (e) { return ''; }
        }
        function formatHarga(h) {
            const n = parseInt(String(h == null ? '' : h).replace(/[^0-9]/g, ''), 10);
            if (!n) return 'Hubungi kami';
            return 'Rp ' + n.toLocaleString('id-ID');
        }

        // ===== Jam & pasaran (WIB, UTC+7 tetap) =====
        function updateClock() {
            const d = new Date(Date.now() + 7 * 3600 * 1000);
            const pad = n => String(n).padStart(2, '0');
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const pasaran = ['Wage', 'Kliwon', 'Legi', 'Pahing', 'Pon'];
            const diff = Math.floor((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(2024, 0, 1)) / 86400000);
            const p = pasaran[(((diff + 3) % 5) + 5) % 5];
            document.getElementById('clockTime').textContent = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
            document.getElementById('clockDate').textContent = days[d.getUTCDay()] + ' ' + p + ', ' + d.getUTCDate() + ' ' + months[d.getUTCMonth()] + ' ' + d.getUTCFullYear() + ' · WIB';
        }
        setInterval(updateClock, 1000);
        updateClock();
        document.getElementById('year').textContent = new Date().getFullYear();

        // ===== Data produk =====
        let products = [];
        let activeCat = 'Semua';
        let query = '';

        // JSONP: memuat data dari Apps Script tanpa kena blokir CORS
        function loadJsonp(url) {
            return new Promise((resolve, reject) => {
                const cb = '__katalogCb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
                const s = document.createElement('script');
                const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 15000);
                function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
                window[cb] = data => { cleanup(); resolve(data); };
                s.onerror = () => { cleanup(); reject(new Error('network')); };
                s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cb + '&t=' + Date.now();
                document.head.appendChild(s);
            });
        }

        // Judul kolom sheet → nama field
        const SHEET_MAP = {
            'nama produk': 'nama', 'harga': 'harga', 'deskripsi': 'deskripsi',
            'url gambar': 'gambar', 'kategori': 'kategori',
            'link shopee': 'shopee', 'link tiktok': 'tiktok'
        };

        // Baca sheet langsung lewat endpoint gviz Google (tanpa Apps Script).
        // Sheet harus di-share "Anyone with the link: Viewer".
        function loadSheet(id) {
            return new Promise((resolve, reject) => {
                const cb = '__katalogGv_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
                const s = document.createElement('script');
                const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 15000);
                function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
                window[cb] = resp => {
                    cleanup();
                    try {
                        const t = resp.table;
                        const keys = t.cols.map(c => SHEET_MAP[String(c.label || '').trim().toLowerCase().replace(/\s+/g, ' ')] || '');
                        const rows = t.rows.map(r => {
                            const o = {};
                            keys.forEach((k, i) => {
                                if (!k) return;
                                const c = (r.c || [])[i];
                                o[k] = c ? (c.v != null ? c.v : (c.f || '')) : '';
                            });
                            return o;
                        }).filter(o => String(o.nama || '').trim() !== '');
                        resolve(rows);
                    } catch (e) { reject(e); }
                };
                s.onerror = () => { cleanup(); reject(new Error('network')); };
                s.src = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(id) +
                    '/gviz/tq?headers=1&tqx=' + encodeURIComponent('responseHandler:' + cb) +
                    '&tq=' + encodeURIComponent('select *');
                document.head.appendChild(s);
            });
        }

        async function loadProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '<div class="state"><div class="spinner"></div>Sedang memuat produk terbaik...</div>';
            try {
                const m = API_URL.match(/\/spreadsheets\/d\/([A-Za-z0-9_-]+)/);
                const data = m ? await loadSheet(m[1]) : await loadJsonp(API_URL);
                if (!Array.isArray(data)) throw new Error('format');
                products = data.filter(p => p && typeof p === 'object' && String(p.nama || '').trim() !== '');
                renderCategories();
                renderProducts();
            } catch (err) {
                grid.innerHTML = '<div class="state">⚠️ Produk belum bisa dimuat.<br><button class="retry" id="retryBtn">Coba lagi</button></div>';
            }
        }

        function renderCategories() {
            const box = document.getElementById('catContainer');
            const cats = ['Semua'].concat([...new Set(products.map(p => String(p.kategori || '').trim()).filter(Boolean))]);
            box.innerHTML = '';
            cats.forEach(c => {
                const b = document.createElement('button');
                b.className = 'cat-btn' + (c === activeCat ? ' active' : '');
                b.dataset.cat = c;
                b.textContent = c;
                box.appendChild(b);
            });
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            if (products.length === 0) {
                grid.innerHTML = '<div class="state">Belum ada produk.</div>';
                return;
            }
            const q = query.toLowerCase();
            const filtered = products.filter(p =>
                (activeCat === 'Semua' || String(p.kategori || '').trim() === activeCat) &&
                String(p.nama).toLowerCase().includes(q)
            );
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="state">Produk tidak ditemukan.</div>';
                return;
            }
            grid.innerHTML = filtered.map(p => {
                const img = safeUrl(p.gambar) || PLACEHOLDER;
                const shopee = safeUrl(p.shopee);
                const tiktok = safeUrl(p.tiktok);
                return '<article class="card">' +
                    '<div class="card-img-wrap"><img src="' + esc(img) + '" alt="' + esc(p.nama) + '" class="card-img" loading="lazy" onerror="this.onerror=null;this.src=PLACEHOLDER"></div>' +
                    '<div class="card-body">' +
                        '<span class="card-cat">' + esc(p.kategori || 'Umum') + '</span>' +
                        '<h3 class="card-title">' + esc(p.nama) + '</h3>' +
                        '<p class="card-desc">' + esc(p.deskripsi || 'Deskripsi tidak tersedia.') + '</p>' +
                        '<div class="card-price">' + esc(formatHarga(p.harga)) + '</div>' +
                        '<div class="card-actions">' +
                            (shopee ? '<a href="' + esc(shopee) + '" target="_blank" rel="noopener" class="btn-buy btn-shopee">🛒 Shopee</a>' : '') +
                            (tiktok ? '<a href="' + esc(tiktok) + '" target="_blank" rel="noopener" class="btn-buy btn-tiktok">🎵 TikTok</a>' : '') +
                        '</div>' +
                    '</div>' +
                '</article>';
            }).join('');
        }

        // ===== Interaksi (event delegation, aman untuk teks apa pun) =====
        document.getElementById('catContainer').addEventListener('click', e => {
            const b = e.target.closest('button[data-cat]');
            if (!b) return;
            activeCat = b.dataset.cat;
            renderCategories();
            renderProducts();
        });
        document.getElementById('productGrid').addEventListener('click', e => {
            if (e.target.closest('#retryBtn')) loadProducts();
        });
        document.getElementById('searchInput').addEventListener('input', e => {
            query = e.target.value;
            renderProducts();
        });

        loadProducts();
    </script>
